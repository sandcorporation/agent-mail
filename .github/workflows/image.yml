# Deployment image: a multi-arch manifest list (linux/amd64, linux/arm64) built on a GitHub-hosted runner and pushed to GHCR as
#   IMAGE_REPO:<40-character commit sha>
# and copied to the old name with the same tag (3단계에 제거):
#   ghcr.io/sandcorporation/agent-mail:<40-character commit sha>
# Jenkins pulls IMAGE_REPO. The copy only serves hosts that still pull the old name; it may fail without failing
# the deployment image.
# promote.yml calls this on every main push. Jenkins later pulls the image of the production head; it never builds.
#
# Security (public repository):
#   - Only main pushes (via promote.yml) and manual runs. Never pull_request or pull_request_target.
#   - packages: write only here; login uses GITHUB_TOKEN, no other secrets. Actions are pinned by SHA.
#   - Build arguments are not secret; logs are public.
name: image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_REPO: ghcr.io/sandcorporation/switchboard # Jenkins pulls this name
      OLD_IMAGE_REPO: ghcr.io/sandcorporation/agent-mail # 3단계에 제거
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: ver
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.ver.outputs.short }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max
      # imagetools create copies the whole manifest list, so the old name is multi-arch too. 3단계에 제거.
      - name: Copy to the old image name
        continue-on-error: true
        run: docker buildx imagetools create --tag "$OLD_IMAGE_REPO:$GITHUB_SHA" "$IMAGE_REPO:$GITHUB_SHA"
