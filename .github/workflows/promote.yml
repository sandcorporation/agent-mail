# main push -> checks || image -> production fast-forward. The production branch head is the deployed version.
# The Jenkins deploy job (Jenkinsfile) watches production only: it does not build or test, it pulls the image for that sha.
#
#   reuse    scripts/ci/reuse.sh check: when the pull request this push merged has a successful CI run (test and
#            windows, tests not skipped) on a head with the same git tree, logs "재사용: run R" and check is skipped.
#            Decided only from GitHub API values and git trees, never from what a pull request run wrote (#339).
#   check    ci.yml (workflow_call) — the same checks as pull requests, unless reuse found a run. If it fails
#            nothing is promoted.
#   image    image.yml (workflow_call), in parallel with check — the deployment image tagged <sha>.
#   promote  needs check and image. Fast-forwards production to this sha (scripts/ci/promote.sh ff).
#            If production is already newer (an older run finished late) it skips instead of failing.
# production only moves forward. Roll back with a revert PR on main, or for emergencies the Jenkins ROLLBACK_SHA parameter.
#
# Manual run (workflow_dispatch): re-runs a promote that GitHub never started for a main push, e.g.
#   gh workflow run promote.yml --ref main
# It promotes the current main head, the same as a push would.
#
# Security (public repository): main pushes and manual runs on main only (every job checks github.ref, so a dispatch
# on any other ref does nothing), GitHub-hosted runners only, actions pinned by SHA, no extra secrets.
# No default permissions; contents: write only in the promote job. A GITHUB_TOKEN push does not trigger other workflows,
# but the repository webhook (Jenkins) does see it.
name: promote

on:
  push:
    branches: [main]
    # Documentation-only pushes do not rebuild, promote or redeploy. The next code push promotes main as a whole.
    paths-ignore:
      - '**.md'
  # Only main is promoted; the jobs below skip on any other ref.
  workflow_dispatch:

permissions: {}

jobs:
  reuse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.decide.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reuse the pull request run on the same tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if bash scripts/ci/reuse.sh check "$SHA"; then echo reused=true >>"$GITHUB_OUTPUT"; else echo reused=false >>"$GITHUB_OUTPUT"; fi

  check:
    needs: reuse
    if: github.ref == 'refs/heads/main' && needs.reuse.outputs.reused != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  promote:
    # check is skipped when reuse found a run; anything else that is not success stops the promotion.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.reuse.result == 'success' && needs.image.result == 'success'
      && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.reuse.outputs.reused == 'true'))
    needs: [reuse, check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: production-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fast-forward production
        env:
          SHA: ${{ github.sha }}
        run: bash scripts/ci/promote.sh ff "$SHA"
