# Checks for pull requests. On main pushes promote.yml calls this workflow (workflow_call) before promoting.
# Security: GitHub-hosted runners only, no pull_request_target, no secrets, read-only token.
name: CI
on:
  push:
    branches: [work]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux (terminal backend tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Question source of truth (server e2e)
        run: bash scripts/ci/question_sot.sh
      - name: Answered rule golden (bump mail.AnsweredRuleVersion on change)
        run: bash scripts/ci/answered_golden.sh
      - name: Hosting end to end (up, tmux)
        run: bash scripts/ci/e2e.sh
      - name: tmux backend against real tmux
        env:
          SWITCHBOARD_TEST_TMUX: require
        run: go test -count=1 -v ./internal/term/tmux/
      - run: go test ./...
        env:
          SWITCHBOARD_TEST_TMUX: require
          # The dashboard's Markdown renderer tests run under node (preinstalled on the runner).
          SWITCHBOARD_TEST_NODE: require
      - run: go vet ./...
      - run: go build ./cmd/switchboard
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - run: bash scripts/ci/promote_test.sh
  windows:
    # ConPTY backend and keeper against real Windows. The ConPTY output of
    # each golden scene is uploaded as the conpty-recordings artifact (the
    # source of internal/term/testdata/conpty).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Keeper tests x100 (#261, temporary)
        shell: bash
        continue-on-error: true
        run: |
          go test -timeout 40m -count=100 -run 'TestKeeper' ./internal/term/conpty/ > "$RUNNER_TEMP/r.txt" 2>&1; echo "exit=$?"
          echo "FAIL lines: $(grep -c -- '--- FAIL' "$RUNNER_TEMP/r.txt")"
          grep -o -- '--- FAIL: [A-Za-z0-9]*' "$RUNNER_TEMP/r.txt" | sort | uniq -c; echo "RemoveAll lines: $(grep -c RemoveAll "$RUNNER_TEMP/r.txt")"; grep -m3 -B1 'RemoveAll\|_test.go:[0-9]*:' "$RUNNER_TEMP/r.txt" | cut -c1-220
          tail -n 3 "$RUNNER_TEMP/r.txt"
      - name: Keeper exit times, this keeper.go (#261, temporary)
        shell: bash
        continue-on-error: true
        run: |
          go test -timeout 30m -count=50 -v -run '^TestDiag261KeeperExit$' ./internal/term/conpty/ > "$RUNNER_TEMP/d.txt" 2>&1; echo "exit=$?"
          grep -o 'diag261.*' "$RUNNER_TEMP/d.txt" > "$RUNNER_TEMP/d1.txt"; wc -l < "$RUNNER_TEMP/d1.txt"
          for k in v1_exit_after_replaced_ms v2_shutdown_call_ms v2_exit_after_shutdown_ms; do
            grep -o "$k=-\?[0-9]*" "$RUNNER_TEMP/d1.txt" | cut -d= -f2 | sort -n | awk -v k=$k '{a[NR]=$1} END {print k, "n="NR, "min="a[1], "median="a[int((NR+1)/2)], "p90="a[int(NR*0.9)], "max="a[NR]}'
          done
          grep -- '--- FAIL\|RemoveAll' "$RUNNER_TEMP/d.txt" | head
      - name: Before #227 keeper.go, exit times and x100 (#261, temporary)
        shell: bash
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin a25cb21d12ac4d5543ad35850b5de360468edefd
          git show a25cb21d12ac4d5543ad35850b5de360468edefd:internal/term/conpty/keeper.go > internal/term/conpty/keeper.go
          git show a25cb21d12ac4d5543ad35850b5de360468edefd:internal/term/conpty/keeper_test.go > internal/term/conpty/keeper_test.go
          go test -timeout 30m -count=50 -v -run '^TestDiag261KeeperExit$' ./internal/term/conpty/ > "$RUNNER_TEMP/o.txt" 2>&1; echo "exit=$?"
          grep -o 'diag261.*' "$RUNNER_TEMP/o.txt" > "$RUNNER_TEMP/o1.txt"; wc -l < "$RUNNER_TEMP/o1.txt"
          for k in v1_exit_after_replaced_ms v2_shutdown_call_ms v2_exit_after_shutdown_ms; do
            grep -o "$k=-\?[0-9]*" "$RUNNER_TEMP/o1.txt" | cut -d= -f2 | sort -n | awk -v k=$k '{a[NR]=$1} END {print k, "n="NR, "min="a[1], "median="a[int((NR+1)/2)], "p90="a[int(NR*0.9)], "max="a[NR]}'
          done
          grep -- '--- FAIL\|RemoveAll' "$RUNNER_TEMP/o.txt" | head
          go test -timeout 40m -count=100 -run 'TestKeeper' ./internal/term/conpty/ > "$RUNNER_TEMP/r0.txt" 2>&1; echo "exit=$?"
          echo "FAIL lines: $(grep -c -- '--- FAIL' "$RUNNER_TEMP/r0.txt")"
          grep -o -- '--- FAIL: [A-Za-z0-9]*' "$RUNNER_TEMP/r0.txt" | sort | uniq -c; echo "RemoveAll lines: $(grep -c RemoveAll "$RUNNER_TEMP/r0.txt")"; grep -m3 -B1 'RemoveAll\|_test.go:[0-9]*:' "$RUNNER_TEMP/r0.txt" | cut -c1-220
          git checkout -- internal/term/conpty
      - name: Slow keeper exit, x5 (#261, temporary)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          go test -count=5 -v -run '^TestCleanupWaitsForTheReplacedKeeper$' ./internal/term/conpty/ > "$RUNNER_TEMP/h.txt" 2>&1; echo "exit=$?"
          grep -- '--- \(PASS\|FAIL\)\|RemoveAll\|temp dir after' "$RUNNER_TEMP/h.txt" | cut -c1-220
      - name: Keeper tests x100 (#261, temporary)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          go test -timeout 40m -count=100 -run 'TestKeeper' ./internal/term/conpty/ > "$RUNNER_TEMP/r.txt" 2>&1; echo "exit=$?"
          echo "FAIL lines: $(grep -c -- '--- FAIL' "$RUNNER_TEMP/r.txt")"
          echo "RemoveAll lines: $(grep -c RemoveAll "$RUNNER_TEMP/r.txt")"
          tail -n 2 "$RUNNER_TEMP/r.txt"
      - name: ConPTY backend and keeper
        shell: bash
        run: go test -count=1 -v ./internal/term/conpty/ -args -conpty.record="$RUNNER_TEMP/conpty"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conpty-recordings
          path: ${{ runner.temp }}/conpty
          if-no-files-found: ignore
      - name: Hosting end to end (up, ConPTY keeper)
        shell: bash
        run: bash scripts/ci/e2e.sh
      # The server suite is not Windows-clean yet (its SQLite test databases
      # stay open past TempDir cleanup); it runs on Linux in the test job.
      - name: Exit paths leave a line (#257)
        shell: bash
        run: go test -count=1 -v -run '^TestExitPathsLeaveALine$' ./internal/server/
      - name: Terminal packages
        run: go test -count=1 ./internal/term/...
      - run: go build ./...
      - run: go vet ./...
