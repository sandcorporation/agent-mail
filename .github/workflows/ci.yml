# Checks for pull requests. On main pushes promote.yml calls this workflow (workflow_call) before promoting.
# Security: GitHub-hosted runners only, no pull_request_target, no secrets, read-only token.
name: CI
on:
  push:
    branches: [work]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/agent-mail
      - run: bash scripts/ci/promote_test.sh
