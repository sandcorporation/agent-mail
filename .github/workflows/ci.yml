# Checks for pull requests. On main pushes promote.yml calls this workflow (workflow_call) before promoting.
# Security: GitHub-hosted runners only, no pull_request_target, no secrets, read-only token.
name: CI
on:
  push:
    branches: [work]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux (terminal backend tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Question source of truth (server e2e)
        run: bash scripts/ci/question_sot.sh
      - name: tmux backend against real tmux
        env:
          SWITCHBOARD_TEST_TMUX: require
        run: go test -count=1 -v ./internal/term/tmux/
      - run: go test ./...
        env:
          SWITCHBOARD_TEST_TMUX: require
      - run: go vet ./...
      - run: go build ./cmd/switchboard
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - run: bash scripts/ci/promote_test.sh
