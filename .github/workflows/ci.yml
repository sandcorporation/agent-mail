# Checks for pull requests. On main pushes promote.yml calls this workflow (workflow_call) before promoting.
# Security: GitHub-hosted runners only, no pull_request_target, no secrets, read-only token.
name: CI
on:
  push:
    branches: [work]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# A new commit on a pull request cancels that pull request's older run (#272).
# Every other run gets a group of its own and is never cancelled: a work push,
# a manual run, and promote.yml's check (under workflow_call github.event_name
# and github.workflow are the caller's, "push" and "promote", so it lands in
# ci-promote-<run_id>, which promote.yml never uses).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux (terminal backend tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Question source of truth (server e2e)
        run: bash scripts/ci/question_sot.sh
      - name: Answered rule golden (bump mail.AnsweredRuleVersion on change)
        run: bash scripts/ci/answered_golden.sh
      - name: Hosting end to end (up, tmux)
        run: bash scripts/ci/e2e.sh
      - name: tmux backend against real tmux
        env:
          SWITCHBOARD_TEST_TMUX: require
        run: go test -count=1 -v ./internal/term/tmux/
      - run: go test ./...
        env:
          SWITCHBOARD_TEST_TMUX: require
          # The dashboard's Markdown renderer tests run under node (preinstalled on the runner).
          SWITCHBOARD_TEST_NODE: require
      - run: go vet ./...
      - run: go build ./cmd/switchboard
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - run: bash scripts/ci/promote_test.sh
      - run: bash scripts/go_test.sh
  windows:
    # ConPTY backend and keeper against real Windows. The ConPTY output of
    # each golden scene is uploaded as the conpty-recordings artifact (the
    # source of internal/term/testdata/conpty).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: ConPTY backend and keeper
        shell: bash
        run: go test -count=1 -v ./internal/term/conpty/ -args -conpty.record="$RUNNER_TEMP/conpty"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conpty-recordings
          path: ${{ runner.temp }}/conpty
          if-no-files-found: ignore
      - name: Hosting end to end (up, ConPTY keeper)
        shell: bash
        run: bash scripts/ci/e2e.sh
      - name: Question source of truth (server e2e)
        shell: bash
        run: bash scripts/ci/question_sot.sh
      # Every internal package (the server suite included, #206); the
      # TestE2E_ steps ran in e2e.sh above.
      - name: Server and domain tests
        shell: bash
        run: go test -count=1 -skip '^TestE2E_' ./internal/...
      - run: go build ./...
      - run: go vet ./...
