name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build CLI archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; name="agent-mail_${GITHUB_REF_NAME}_${os}_${arch}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/agent-mail${ext}" ./cmd/agent-mail
            if [ "$os" = windows ]; then (cd dist && zip -q "$name.zip" agent-mail.exe); else tar -C dist -czf "dist/$name.tar.gz" "agent-mail${ext}"; fi
            rm "dist/agent-mail${ext}"
          done
          (cd dist && sha256sum *.zip *.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
